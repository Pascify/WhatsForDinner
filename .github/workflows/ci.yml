name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the running checks pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format, typecheck & repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint --max-warnings 0
      - name: Prettier
        run: pnpm format:check
      - name: Repo rules (em dashes, env vars, action sessions, test names)
        run: pnpm check:rules

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: next build
        run: pnpm build
        env:
          # The build reads no secrets; this only keeps it quiet.
          NEXT_TELEMETRY_DISABLED: "1"

  test:
    name: Tests & coverage
    # Only worth running once the code at least compiles and lints.
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # mongodb-memory-server downloads a ~77 MB binary for the integration tests.
      - name: Cache the MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: pnpm install --frozen-lockfile

      - name: Unit, integration and component tests
        run: pnpm test:coverage

      - name: Comment coverage on the pull request
        if: github.event_name == 'pull_request' && always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Coverage
