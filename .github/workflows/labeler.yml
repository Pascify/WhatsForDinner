name: Labeler

on:
  # pull_request_target runs the workflow from main, so a PR cannot rewrite it to abuse the token.
  # It never checks out the PR's code.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by area
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
